<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Special Quest For You ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <div class="progress-bg">
            <div id="progressFill"></div>
        </div>
        <div class="lvl-text" id="lvlIndicator">Level 1: The Choice</div>
    </div>

    <div class="card">
        <h1 id="heading">Will you be my Valentine?</h1>
        <div class="game-area" id="gameArea">
            <button id="mainBtn" onclick="handleYes()">Yes</button>
            <button id="noBtn" ontouchstart="handleNo(event)" onmouseover="handleNo(event)">No</button>
        </div>
    </div>

    <button id="collector" onclick="handleCollect()">Tap Me!</button>

    <script src="script.js"></script>
</body>
</html>
